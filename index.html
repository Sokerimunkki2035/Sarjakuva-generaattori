<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pertti TikTok Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/3.6.2/fabric.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #1a1a1a; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; color: white; }
        .panel { background: #333; padding: 10px; border-radius: 12px; margin-bottom: 10px; width: 100%; max-width: 350px; display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; border: 1px solid #444; }
        select, button { padding: 12px; border-radius: 8px; border: none; font-size: 14px; font-weight: bold; }
        button { background: #007bff; color: white; cursor: pointer; }
        .edit-btn { background: #f39c12 !important; color: black !important; width: 100%; margin-top: 5px; font-size: 16px; }
        #canvas-wrapper { border: 2px solid #555; background: white; line-height: 0; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .info { font-size: 11px; color: #aaa; margin: 5px 0; text-align: center; }
    </style>
</head>
<body>

    <div class="panel">
        <select id="charSelect" style="width: 100%; margin-bottom: 5px;">
            <option value="Boyseveral.png">Poika</option>
            <option value="tyttojaisa.png">Tyttö</option>
            <option value="Momsad.png">Äiti</option>
            <option value="isatulee.png">Isä</option>
            <option value="Selinda.png">Selinda</option>
            <option value="Supersankari.png">Supersankari</option>
            <option value="SadDad.jpeg">Sad Dad</option>
        </select>
        <button onclick="lisaaKuvaHahmo()">+ Hahmo</button>
        <button onclick="lisaaPuhekupla()">+ Kupla</button>
        <button onclick="lisaaTeksti()">+ Teksti</button>
        <button class="edit-btn" onclick="avaaNayppaimisto()">KIRJOITA (Avaa näppäimistö)</button>
    </div>

    <div id="canvas-wrapper">
        <canvas id="canvas"></canvas>
    </div>
    <p class="info">TikTok peittää alaosan ja oikean reunan – pidä hahmot keskellä!</p>

    <div class="panel">
        <button style="background:#444" onclick="liikuta(0,-20)">Ylös</button>
        <button style="background:#444" onclick="liikuta(0,20)">Alas</button>
        <button style="background:#444" onclick="muutaKokoa(1.2, 1.2)">Isompi</button>
        <button style="background:#444" onclick="muutaKokoa(0.8, 0.8)">Pienempi</button>
        <button style="background:#dc3545" onclick="poistaValittu()">Poista</button>
        <button style="background:#28a745; width:100%; margin-top:5px;" onclick="tallennaKuva()">TALLENNA TIKTOK-VALMIINA</button>
    </div>

    <script>
        // TikTok pystykuva (korkea formaatti)
        var canvas = new fabric.Canvas('canvas', {
            width: 320,
            height: 560,
            backgroundColor: 'white'
        });

        function lisaaKuvaHahmo() {
            var tiedosto = document.getElementById('charSelect').value;
            fabric.Image.fromURL(tiedosto, function(img) {
                img.scaleToWidth(180);
                img.set({ left: 70, top: 150 });
                canvas.add(img);
                canvas.setActiveObject(img);
            });
        }

        function lisaaPuhekupla() {
            var kupla = new fabric.Path('M 20 0 L 180 0 Q 200 0 200 20 L 200 80 Q 200 100 180 100 L 60 100 L 30 130 L 40 100 L 20 100 Q 0 100 0 80 L 0 20 Q 0 0 20 0 Z', {
                fill: 'white', stroke: 'black', strokeWidth: 2, left: 50, top: 50
            });
            canvas.add(kupla);
            canvas.setActiveObject(kupla);
        }

        function lisaaTeksti() {
            var teksti = new fabric.IText('Kirjoita...', {
                left: 60, top: 60, fontSize: 26, fontFamily: 'Arial', fontWeight: 'bold'
            });
            canvas.add(teksti);
            canvas.setActiveObject(teksti);
        }

        function avaaNayppaimisto() {
            var obj = canvas.getActiveObject();
            if (obj && obj.type === 'i-text') {
                obj.enterEditing();
                obj.hiddenTextarea.focus();
                canvas.renderAll();
            } else {
                alert("Valitse teksti ensin klikkaamalla sitä!");
            }
        }

        function liikuta(dx, dy) {
            var obj = canvas.getActiveObject();
            if (obj) {
                obj.set({ left: obj.left + dx, top: obj.top + dy });
                obj.setCoords();
                canvas.renderAll();
            }
        }

        function muutaKokoa(sx, sy) {
            var obj = canvas.getActiveObject();
            if (obj) {
                obj.set({ scaleX: obj.scaleX * sx, scaleY: obj.scaleY * sy });
                obj.setCoords();
                canvas.renderAll();
            }
        }

        function poistaValittu() {
            var obj = canvas.getActiveObject();
            if (obj) canvas.remove(obj);
        }

        function tallennaKuva() {
            canvas.discardActiveObject();
            canvas.renderAll();
            var dataURL = canvas.toDataURL({ format: 'png', quality: 1 });
            var link = document.createElement('a');
            link.download = 'tiktok_pertti.png';
            link.href = dataURL;
            link.click();
        }
    </script>
</body>
</html>
