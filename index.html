<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sarjakuva-generaattori 4.1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/3.6.2/fabric.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .panel { background: white; padding: 10px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 10px; width: 100%; max-width: 850px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .control-group { display: flex; flex-direction: column; gap: 4px; min-width: 100px; }
        label { font-size: 11px; font-weight: bold; color: #555; }
        select, button { padding: 8px; border-radius: 6px; border: 1px solid #ddd; font-size: 13px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        
        /* Ohjauspaneeli sivussa */
        .main-container { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .d-pad { display: grid; grid-template-columns: repeat(3, 45px); grid-template-rows: repeat(2, 45px); gap: 5px; background: #eee; padding: 10px; border-radius: 10px; }
        .size-pad { display: grid; grid-template-columns: repeat(2, 60px); gap: 5px; background: #ddd; padding: 10px; border-radius: 10px; }
        .pad-btn { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #444; color: white; border-radius: 5px; font-size: 18px; user-select: none; touch-action: manipulation; }
        .pad-btn:active { background: #000; }

        #canvas-wrapper { border: 2px solid #333; background: white; line-height: 0; box-shadow: 0 0 20px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div class="panel">
        <div class="control-group">
            <label>Hahmo</label>
            <select id="charSelect">
                <option value="Boyseveral.png">Poika</option>
                <option value="tyttojaisa.png">Tyttö</option>
                <option value="Momsad.png">Äiti</option>
                <option value="isatulee.png">Isä</option>
                <option value="Selinda.png">Selinda</option>
                <option value="Supersankari.png">Supersankari</option>
                <option value="SadDad.jpeg">Sad Dad</option>
            </select>
        </div>
        <button onclick="lisaaKuvaHahmo()">+ Hahmo</button>
        <button onclick="lisaaPuhekupla()">+ Kupla</button>
        <button onclick="lisaaTeksti()">+ Teksti</button>
        <button style="background:#6c757d" onclick="siirraEteen()">Eteen</button>
        <button style="background:#dc3545" onclick="poistaValittu()">Poista</button>
        <button style="background:#28a745" onclick="tallennaKuva()">Tallenna</button>
    </div>

    <div class="main-container">
        <div class="d-pad">
            <div></div><div class="pad-btn" onclick="liikuta(0,-10)">▲</div><div></div>
            <div class="pad-btn" onclick="liikuta(-10,0)">◀</div><div class="pad-btn" onclick="liikuta(0,10)">▼</div><div class="pad-btn" onclick="liikuta(10,0)">▶</div>
        </div>

        <div id="canvas-wrapper">
            <canvas id="canvas"></canvas>
        </div>

        <div class="size-pad">
            <div class="pad-btn" onclick="muutaKokoa(1.1, 1.1)">+ Isompi</div>
            <div class="pad-btn" onclick="muutaKokoa(0.9, 0.9)">- Pienempi</div>
            <div class="pad-btn" onclick="muutaKokoa(1.1, 1)">↔ Leveä</div>
            <div class="pad-btn" onclick="muutaKokoa(1, 1.1)">↕ Korkea</div>
        </div>
    </div>

    <script>
        var canvas = new fabric.Canvas('canvas', {
            width: Math.min(window.innerWidth - 150, 600),
            height: 450,
            backgroundColor: 'white'
        });

        canvas.on('mouse:down', function(e) {
            if (e.target) {
                e.target.bringToFront();
                canvas.renderAll();
            }
        });

        function lisaaKuvaHahmo() {
            var tiedosto = document.getElementById('charSelect').value;
            fabric.Image.fromURL(tiedosto, function(img) {
                img.scaleToWidth(150);
                img.set({ left: 50, top: 50 });
                canvas.add(img);
                canvas.setActiveObject(img);
            });
        }

        function lisaaPuhekupla() {
            var kupla = new fabric.Path('M 20 0 L 180 0 Q 200 0 200 20 L 200 80 Q 200 100 180 100 L 60 100 L 30 130 L 40 100 L 20 100 Q 0 100 0 80 L 0 20 Q 0 0 20 0 Z', {
                fill: 'white', stroke: 'black', strokeWidth: 2, left: 100, top: 50
            });
            canvas.add(kupla);
            canvas.setActiveObject(kupla);
        }

        function lisaaTeksti() {
            var teksti = new fabric.IText('Kirjoita...', {
                left: 120, top: 70, fontSize: 22, fontFamily: 'Arial'
            });
            canvas.add(teksti);
            canvas.setActiveObject(teksti);
        }

        function liikuta(dx, dy) {
            var obj = canvas.getActiveObject();
            if (obj) {
                obj.set({ left: obj.left + dx, top: obj.top + dy });
                obj.setCoords();
                canvas.renderAll();
            }
        }

        function muutaKokoa(sx, sy) {
            var obj = canvas.getActiveObject();
            if (obj) {
                obj.set({ scaleX: obj.scaleX * sx, scaleY: obj.scaleY * sy });
                obj.setCoords();
                canvas.renderAll();
            }
        }

        function siirraEteen() {
            var obj = canvas.getActiveObject();
            if (obj) { obj.bringToFront(); canvas.renderAll(); }
        }

        function poistaValittu() {
            var obj = canvas.getActiveObject();
            if (obj) canvas.remove(obj);
        }

        function tallennaKuva() {
            var dataURL = canvas.toDataURL({ format: 'png', quality: 1 });
            var link = document.createElement('a');
            link.download = 'sarjis.png'; link.href = dataURL; link.click();
        }
    </script>
</body>
</html>
